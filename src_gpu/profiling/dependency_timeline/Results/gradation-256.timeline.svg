<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430">
  <style>
    text { font-family: "Segoe UI", sans-serif; fill: #202124; }
    .title { font-size: 22px; font-weight: 600; }
    .subtitle { font-size: 12px; fill: #5f6368; }
    .lane { font-size: 13px; font-weight: 600; }
    .bar-label { font-size: 11px; fill: white; font-weight: 600; }
    .duration { font-size: 11px; fill: #3c4043; }
    .tick { font-size: 10px; fill: #6b7280; }
    .grid { stroke: #d9dde3; stroke-width: 1; }
    .dependency { stroke: #59636e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
    <pattern id="gpuHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eeca3b"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c59f16" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1160" height="430" fill="#ffffff"/>
  <text x="24" y="34" class="title">RGBA8 pair comparison dependency timeline</text>
  <text x="24" y="55" class="subtitle">tests/gradation.png → tests/gradation-256.png · durations from profiling JSON · 2026-07-05</text>

  <!-- Plot origin x=190; scale=6 px/ms. -->
  <g>
    <line x1="190" y1="75" x2="190" y2="365" class="grid"/>
    <line x1="310" y1="75" x2="310" y2="365" class="grid"/>
    <line x1="430" y1="75" x2="430" y2="365" class="grid"/>
    <line x1="550" y1="75" x2="550" y2="365" class="grid"/>
    <line x1="670" y1="75" x2="670" y2="365" class="grid"/>
    <line x1="790" y1="75" x2="790" y2="365" class="grid"/>
    <line x1="910" y1="75" x2="910" y2="365" class="grid"/>
    <line x1="1030" y1="75" x2="1030" y2="365" class="grid"/>
    <text x="190" y="382" text-anchor="middle" class="tick">0 ms</text>
    <text x="310" y="382" text-anchor="middle" class="tick">20</text>
    <text x="430" y="382" text-anchor="middle" class="tick">40</text>
    <text x="550" y="382" text-anchor="middle" class="tick">60</text>
    <text x="670" y="382" text-anchor="middle" class="tick">80</text>
    <text x="790" y="382" text-anchor="middle" class="tick">100</text>
    <text x="910" y="382" text-anchor="middle" class="tick">120</text>
    <text x="1030" y="382" text-anchor="middle" class="tick">140</text>
  </g>

  <!-- Known overlap windows. GPU placement inside submit/wait is schematic. -->
  <rect x="772" y="82" width="210" height="145" rx="5" fill="#eeca3b" opacity="0.10"/>
  <text x="877" y="94" text-anchor="middle" class="tick">CPU submit/wait ↔ GPU overlap</text>
  <rect x="982" y="252" width="16" height="103" rx="4" fill="#54a24b" opacity="0.13"/>

  <text x="24" y="130" class="lane">CPU wall-clock (MECE)</text>
  <rect x="190" y="105" width="294" height="42" rx="4" fill="#4c78a8"/>
  <text x="337" y="125" text-anchor="middle" class="bar-label">create buffers</text>
  <text x="337" y="140" text-anchor="middle" class="bar-label">49 ms</text>

  <rect x="484" y="105" width="288" height="42" rx="4" fill="#72b7b2"/>
  <text x="628" y="125" text-anchor="middle" class="bar-label">upload inputs</text>
  <text x="628" y="140" text-anchor="middle" class="bar-label">48 ms</text>

  <rect x="772" y="105" width="126" height="42" rx="4" fill="#f58518"/>
  <text x="835" y="125" text-anchor="middle" class="bar-label">encode + submit</text>
  <text x="835" y="140" text-anchor="middle" class="bar-label">21 ms</text>

  <rect x="898" y="105" width="84" height="42" rx="4" fill="#e45756"/>
  <text x="940" y="125" text-anchor="middle" class="bar-label">readback</text>
  <text x="940" y="140" text-anchor="middle" class="bar-label">14 ms</text>

  <rect x="982" y="105" width="58" height="42" rx="4" fill="#54a24b"/>
  <text x="1011" y="125" text-anchor="middle" class="bar-label">post</text>
  <text x="1011" y="140" text-anchor="middle" class="bar-label">9 ms</text>

  <rect x="1040" y="105" width="18" height="42" rx="4" fill="#b279a2"/>
  <text x="1049" y="164" text-anchor="middle" class="duration">other 3 ms</text>

  <text x="24" y="215" class="lane">GPU Timestamp Query</text>
  <rect x="838" y="180" width="105.4" height="42" rx="4" fill="url(#gpuHatch)" stroke="#b58d00" stroke-dasharray="4 3"/>
  <text x="890.7" y="200" text-anchor="middle" class="bar-label">GPU execution</text>
  <text x="890.7" y="215" text-anchor="middle" class="bar-label">17.564 ms</text>
  <path d="M 772 147 L 772 169 L 838 169 L 838 180" class="dependency"/>
  <path d="M 943.4 222 L 943.4 242 L 982 242 L 982 252" class="dependency"/>
  <text x="960" y="233" class="tick">rejoin before postprocess</text>

  <text x="24" y="290" class="lane">CPU postprocess: main</text>
  <rect x="982" y="262" width="57.9" height="34" rx="4" fill="#54a24b"/>
  <text x="1011" y="283" text-anchor="middle" class="bar-label">scale 0</text>
  <text x="1046" y="283" class="duration">9.652 ms</text>

  <text x="24" y="345" class="lane">CPU postprocess: worker</text>
  <rect x="982" y="317" width="15.4" height="34" rx="4" fill="#9d755d"/>
  <text x="1004" y="340" class="duration">scales 1–4 · 2.571 ms</text>
  <path d="M 982 296 L 972 306 L 982 317" class="dependency"/>

  <text x="24" y="406" class="subtitle">Solid CPU bars use wall-clock buckets. Hatched GPU duration is exact; horizontal placement is schematic because WebGPU Timestamp Query does not calibrate to the CPU clock.</text>
</svg>
