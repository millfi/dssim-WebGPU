<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430">
  <style>
    text { font-family: "Segoe UI", sans-serif; fill: #202124; }
    .title { font-size: 22px; font-weight: 600; }
    .subtitle { font-size: 12px; fill: #5f6368; }
    .lane { font-size: 13px; font-weight: 600; }
    .bar-label { font-size: 11px; fill: white; font-weight: 600; }
    .duration { font-size: 11px; fill: #3c4043; }
    .tick { font-size: 10px; fill: #6b7280; }
    .grid { stroke: #d9dde3; stroke-width: 1; }
    .dependency { stroke: #59636e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
    <pattern id="gpuHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eeca3b"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c59f16" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1160" height="430" fill="#ffffff"/>
  <text x="24" y="34" class="title">RGBA8 pair comparison dependency timeline</text>
  <text x="24" y="55" class="subtitle">tests/gradation.png → tests/gradation-256.png · Vulkan durations from profiling JSON · 2026-07-11</text>

  <!-- Plot origin x=190; scale=6 px/ms. -->
  <g>
    <line x1="190" y1="75" x2="190" y2="365" class="grid"/>
    <line x1="310" y1="75" x2="310" y2="365" class="grid"/>
    <line x1="430" y1="75" x2="430" y2="365" class="grid"/>
    <line x1="550" y1="75" x2="550" y2="365" class="grid"/>
    <line x1="670" y1="75" x2="670" y2="365" class="grid"/>
    <line x1="790" y1="75" x2="790" y2="365" class="grid"/>
    <line x1="910" y1="75" x2="910" y2="365" class="grid"/>
    <line x1="1030" y1="75" x2="1030" y2="365" class="grid"/>
    <text x="190" y="382" text-anchor="middle" class="tick">0 ms</text>
    <text x="310" y="382" text-anchor="middle" class="tick">20</text>
    <text x="430" y="382" text-anchor="middle" class="tick">40</text>
    <text x="550" y="382" text-anchor="middle" class="tick">60</text>
    <text x="670" y="382" text-anchor="middle" class="tick">80</text>
    <text x="790" y="382" text-anchor="middle" class="tick">100</text>
    <text x="910" y="382" text-anchor="middle" class="tick">120</text>
    <text x="1030" y="382" text-anchor="middle" class="tick">140</text>
  </g>

  <!-- Known overlap windows. GPU placement inside submit/wait is schematic. -->
  <rect x="778" y="82" width="108" height="145" rx="5" fill="#eeca3b" opacity="0.10"/>
  <text x="832" y="94" text-anchor="middle" class="tick">CPU submit/wait ↔ GPU overlap</text>
  <rect x="886" y="252" width="17" height="103" rx="4" fill="#54a24b" opacity="0.13"/>

  <text x="24" y="130" class="lane">CPU wall-clock (MECE)</text>
  <rect x="190" y="105" width="558" height="42" rx="4" fill="#4c78a8"/>
  <text x="469" y="125" text-anchor="middle" class="bar-label">create arenas</text>
  <text x="469" y="140" text-anchor="middle" class="bar-label">93 ms</text>

  <rect x="748" y="105" width="30" height="42" rx="4" fill="#72b7b2"/>
  <text x="763" y="164" text-anchor="middle" class="duration">upload 5 ms</text>

  <rect x="778" y="105" width="18" height="42" rx="4" fill="#f58518"/>
  <text x="787" y="177" text-anchor="middle" class="duration">submit 3 ms</text>

  <rect x="796" y="105" width="90" height="42" rx="4" fill="#e45756"/>
  <text x="841" y="125" text-anchor="middle" class="bar-label">readback</text>
  <text x="841" y="140" text-anchor="middle" class="bar-label">15 ms</text>

  <rect x="886" y="105" width="48" height="42" rx="4" fill="#54a24b"/>
  <text x="910" y="125" text-anchor="middle" class="bar-label">post</text>
  <text x="910" y="140" text-anchor="middle" class="bar-label">8 ms</text>

  <rect x="934" y="105" width="6" height="42" rx="3" fill="#b279a2"/>
  <text x="950" y="164" text-anchor="middle" class="duration">other 1 ms</text>

  <text x="24" y="215" class="lane">GPU Timestamp Query</text>
  <rect x="802" y="180" width="60.9" height="42" rx="4" fill="url(#gpuHatch)" stroke="#b58d00" stroke-dasharray="4 3"/>
  <text x="832.5" y="200" text-anchor="middle" class="bar-label">GPU execution</text>
  <text x="832.5" y="215" text-anchor="middle" class="bar-label">10.146 ms</text>
  <path d="M 778 147 L 778 169 L 802 169 L 802 180" class="dependency"/>
  <path d="M 862.9 222 L 862.9 242 L 886 242 L 886 252" class="dependency"/>
  <text x="872" y="233" class="tick">rejoin before postprocess</text>

  <text x="24" y="290" class="lane">CPU postprocess: main</text>
  <rect x="886" y="262" width="49.7" height="34" rx="4" fill="#54a24b"/>
  <text x="911" y="283" text-anchor="middle" class="bar-label">scale 0</text>
  <text x="942" y="283" class="duration">8.287 ms</text>

  <text x="24" y="345" class="lane">CPU postprocess: worker</text>
  <rect x="886" y="317" width="16.8" height="34" rx="4" fill="#9d755d"/>
  <text x="910" y="340" class="duration">scales 1–4 · 2.799 ms</text>
  <path d="M 886 296 L 876 306 L 886 317" class="dependency"/>

  <text x="24" y="406" class="subtitle">Solid CPU bars use wall-clock buckets. Hatched Vulkan GPU duration is exact; horizontal placement is schematic because this profiler does not calibrate GPU and CPU clocks.</text>
</svg>
