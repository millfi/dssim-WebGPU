<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="140"></feGaussianBlur>
    </filter>

    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8d2d3"></stop>
      <stop offset="50%" stop-color="#f2d7d4"></stop>
      <stop offset="100%" stop-color="#d4e8df"></stop>
    </linearGradient>
  </defs>

  <!-- ベース -->
  <rect width="1600" height="1200" fill="url(#base)"></rect>

  <!-- ぼかし色面 -->
  <g filter="url(#blur)" opacity="0.9">
    <circle cx="320" cy="260" r="300" fill="#8a7cff"></circle>
    <circle cx="760" cy="300" r="360" fill="#ffb06b"></circle>
    <circle cx="1320" cy="160" r="240" fill="#f19cff"></circle>
    <circle cx="1360" cy="520" r="360" fill="#54ff3c"></circle>
    <circle cx="1140" cy="760" r="300" fill="#dfff3f"></circle>
    <circle cx="780" cy="1080" r="320" fill="#8ef3ee"></circle>
    <circle cx="1500" cy="1080" r="180" fill="#cf7cff"></circle>
    <circle cx="220" cy="1120" r="220" fill="#7ff2b2"></circle>
    <circle cx="500" cy="620" r="320" fill="#e7b6ff"></circle>
    <circle cx="900" cy="640" r="260" fill="#ffe5d8"></circle>
    <circle cx="70" cy="620" r="340" fill="#a6b5b2"></circle>
  </g>

  <!-- 全体を少しやわらかくする白レイヤー -->
  <rect width="1600" height="1200" fill="white" opacity="0"></rect>
</svg>