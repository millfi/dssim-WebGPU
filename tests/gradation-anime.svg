<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="140">
        <animate attributeName="stdDeviation" values="140;180;130;170;140" dur="2s" repeatCount="indefinite"></animate>
      </feGaussianBlur>
    </filter>

    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8d2d3">
        <animate attributeName="stop-color" values="#c8d2d3;#d8cfee;#c7dfdc;#c8d2d3" dur="3.2s" repeatCount="indefinite"></animate>
      </stop>
      <stop offset="50%" stop-color="#f2d7d4">
        <animate attributeName="stop-color" values="#f2d7d4;#f7e1c9;#edd6ea;#f2d7d4" dur="3s" repeatCount="indefinite"></animate>
      </stop>
      <stop offset="100%" stop-color="#d4e8df">
        <animate attributeName="stop-color" values="#d4e8df;#d8e3f4;#e4efcf;#d4e8df" dur="3.4s" repeatCount="indefinite"></animate>
      </stop>
    </linearGradient>
  </defs>

  <!-- ベース -->
  <rect width="1600" height="1200" fill="url(#base)"></rect>

  <!-- ぼかし色面 -->
  <g filter="url(#blur)" opacity="1">

    <!-- 紫 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 800 600;360 800 600" dur="2.3s" begin="-0.8s" repeatCount="indefinite"></animateTransform>
      <circle cx="320" cy="260" r="300" fill="#8a7cff">
        <animate attributeName="r" values="300;360;270;300" dur="1.7s" begin="-0.5s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.82;1;0.72;0.82" dur="1.3s" begin="-0.9s" repeatCount="indefinite"></animate>
      </circle>
    </g>

    <!-- オレンジ -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 820 560;-360 820 560" dur="2.5s" begin="-1.1s" repeatCount="indefinite"></animateTransform>
      <circle cx="760" cy="300" r="360" fill="#ffb06b">
        <animate attributeName="r" values="360;410;320;360" dur="1.9s" begin="-0.6s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.8;0.96;0.7;0.8" dur="1.4s" begin="-0.3s" repeatCount="indefinite"></animate>
      </circle>
    </g>

    <!-- ピンク -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1200 360;360 1200 360" dur="2.1s" begin="-0.4s" repeatCount="indefinite"></animateTransform>
      <circle cx="1320" cy="160" r="240" fill="#f19cff">
        <animate attributeName="r" values="240;290;210;240" dur="1.5s" begin="-0.8s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.76;0.98;0.68;0.76" dur="1.2s" begin="-0.6s" repeatCount="indefinite"></animate>
      </circle>
    </g>

    <!-- グリーン -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1180 600;-360 1180 600" dur="2.7s" begin="-1.5s" repeatCount="indefinite"></animateTransform>
      <circle cx="1360" cy="520" r="360" fill="#54ff3c">
        <animate attributeName="r" values="360;420;330;360" dur="1.8s" begin="-0.4s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.78;0.96;0.66;0.78" dur="1.4s" begin="-1.0s" repeatCount="indefinite"></animate>
      </circle>
    </g>

    <!-- 黄緑 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 980 760;360 980 760" dur="2.4s" begin="-0.7s" repeatCount="indefinite"></animateTransform>
      <circle cx="1140" cy="760" r="300" fill="#dfff3f">
        <animate attributeName="r" values="300;350;270;300" dur="1.6s" begin="-0.2s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.72;0.94;0.64;0.72" dur="1.3s" begin="-0.8s" repeatCount="indefinite"></animate>
      </circle>
    </g>

    <!-- 水色 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 760 900;-360 760 900" dur="2.6s" begin="-1.2s" repeatCount="indefinite"></animateTransform>
      <circle cx="780" cy="1080" r="320" fill="#8ef3ee">
        <animate attributeName="r" values="320;380;285;320" dur="1.8s" begin="-0.9s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.76;0.95;0.66;0.76" dur="1.4s" begin="-0.5s" repeatCount="indefinite"></animate>
      </circle>
    </g>

    <!-- 右下の紫 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1320 940;360 1320 940" dur="2s" begin="-0.6s" repeatCount="indefinite"></animateTransform>
      <circle cx="1500" cy="1080" r="180" fill="#cf7cff">
        <animate attributeName="r" values="180;225;160;180" dur="1.4s" begin="-0.3s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.74;0.92;0.66;0.74" dur="1.1s" begin="-0.7s" repeatCount="indefinite"></animate>
      </circle>
    </g>

    <!-- 左下のグリーン -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 340 920;-360 340 920" dur="2.2s" begin="-1.4s" repeatCount="indefinite"></animateTransform>
      <circle cx="220" cy="1120" r="220" fill="#7ff2b2">
        <animate attributeName="r" values="220;270;195;220" dur="1.5s" begin="-0.6s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.72;0.9;0.64;0.72" dur="1.2s" begin="-0.4s" repeatCount="indefinite"></animate>
      </circle>
    </g>

    <!-- 中央左の薄紫 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 640 620;360 640 620" dur="2.8s" begin="-1.7s" repeatCount="indefinite"></animateTransform>
      <circle cx="500" cy="620" r="320" fill="#e7b6ff">
        <animate attributeName="r" values="320;380;285;320" dur="1.9s" begin="-0.7s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.7;0.9;0.6;0.7" dur="1.4s" begin="-0.2s" repeatCount="indefinite"></animate>
      </circle>
    </g>

    <!-- 中央の淡いピンク -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 900 640;-360 900 640" dur="2.1s" begin="-0.9s" repeatCount="indefinite"></animateTransform>
      <circle cx="900" cy="640" r="260" fill="#ffe5d8">
        <animate attributeName="r" values="260;320;230;260" dur="1.5s" begin="-0.1s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.72;0.98;0.66;0.72" dur="1.1s" begin="-0.5s" repeatCount="indefinite"></animate>
      </circle>
    </g>

    <!-- 左側のグレー -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 260 620;360 260 620" dur="2.5s" begin="-1.3s" repeatCount="indefinite"></animateTransform>
      <circle cx="70" cy="620" r="340" fill="#a6b5b2">
        <animate attributeName="r" values="340;395;305;340" dur="1.8s" begin="-0.8s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.66;0.84;0.58;0.66" dur="1.3s" begin="-0.6s" repeatCount="indefinite"></animate>
      </circle>
    </g>

  </g>

  <!-- 全体を少しやわらかくする白レイヤー -->
  <rect width="1600" height="1200" fill="white" opacity="0"></rect>
</svg>